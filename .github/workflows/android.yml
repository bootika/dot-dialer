name: Android quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify foundation
        run: ./gradlew --no-daemon :app:compileFossDebugKotlin :app:testFossDebugUnitTest :app:compileFossDebugAndroidTestKotlin :app:lintFossDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
